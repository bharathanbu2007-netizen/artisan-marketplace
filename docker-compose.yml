version: "3.9"
services:
  backend:
    build: ./backend
    container_name: artisan-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules

  admin:
    build: ./admin
    container_name: artisan-admin
    ports:
      - "5173:5173"
    volumes:
      - ./admin:/app
      - /app/node_modules

  mongo:
    image: mongo:7
    container_name: artisan-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
